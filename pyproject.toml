[project]
name = "ccf-glass-render"
version = "0.1.0"
description = "Volumetric glass renders of the Allen CCF with single-neuron reconstructions inside."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Peter Grotz" }]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "nibabel>=5.3,<6",
    "pynrrd>=1.0,<2",
    "matplotlib>=3.9,<4",
    "boto3>=1.35,<2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ccf-render = "ccf_glass_render.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccf_glass_render"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
